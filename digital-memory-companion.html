<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数字彼岸 Digital Beyond</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --deep-space: #071426;
      --space-mid: #0c1f3a;
      --space-light: #132842;
      --nebula: #5A4BFF;
      --nebula-soft: rgba(90, 75, 255, 0.25);
      --cyan: #63E6FF;
      --cyan-soft: rgba(99, 230, 255, 0.2);
      --gold: #FFD37A;
      --gold-soft: rgba(255, 211, 122, 0.25);
      --glass: rgba(255, 255, 255, 0.04);
      --glass-strong: rgba(255, 255, 255, 0.09);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f0f4f8;
      --text-dim: #8a9bb0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(ellipse at 20% 10%, #0c1f3a 0%, #071426 40%, #03080f 100%);
      color: var(--text);
    }

    #three-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .app {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      overflow: hidden;
    }

    /* Spatial Dock */
    .spatial-dock {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 32px;
      z-index: 100;
      padding: 16px 28px;
      background: var(--glass);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .dock-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      opacity: 0.5;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dock-node:hover, .dock-node.active {
      opacity: 1;
      transform: translateY(-4px);
    }

    .dock-orb {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--glass-strong);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.5s ease;
      box-shadow: 0 0 20px transparent;
    }

    .dock-node.active .dock-orb {
      box-shadow: 0 0 30px var(--gold-soft), inset 0 0 12px rgba(255,255,255,0.1);
      border-color: rgba(255,211,122,0.3);
    }

    .dock-label {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    /* View system */
    .view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), visibility 1s;
      pointer-events: none;
    }

    .view.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* Universe View */
    #universe-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .universe-title {
      position: absolute;
      top: 60px;
      left: 60px;
      z-index: 20;
      pointer-events: none;
    }

    .universe-title h1 {
      font-size: 36px;
      font-weight: 300;
      letter-spacing: 0.25em;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--text), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .universe-title p {
      font-size: 14px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      line-height: 1.8;
      max-width: 360px;
    }

    .beyond-star {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 15;
      pointer-events: auto;
    }

    .star-core {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff, var(--gold) 25%, var(--nebula) 60%, transparent 75%);
      filter: blur(2px);
      animation: starPulse 6s ease-in-out infinite;
    }

    .star-glow {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--gold-soft) 0%, var(--nebula-soft) 40%, transparent 70%);
      animation: starGlow 8s ease-in-out infinite;
    }

    .star-label {
      position: absolute;
      bottom: -50px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      letter-spacing: 0.3em;
      color: var(--text-dim);
      white-space: nowrap;
    }

    /* Galaxy View */
    #galaxy-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #galaxy-canvas:active { cursor: grabbing; }

    .galaxy-ui {
      position: absolute;
      top: 60px;
      left: 60px;
      z-index: 20;
      pointer-events: none;
      max-width: 420px;
    }

    .galaxy-ui h2 {
      font-size: 32px;
      font-weight: 300;
      letter-spacing: 0.15em;
      margin-bottom: 10px;
    }

    .galaxy-ui .state {
      font-size: 12px;
      letter-spacing: 0.15em;
      color: var(--gold);
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .galaxy-ui p {
      font-size: 14px;
      color: var(--text-dim);
      line-height: 1.7;
    }

    .companion-message {
      position: absolute;
      max-width: 360px;
      padding: 18px 24px;
      background: var(--glass-strong);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 14px;
      line-height: 1.7;
      color: var(--text);
      opacity: 0;
      transform: scale(0.9) translateY(10px);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 25;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      pointer-events: none;
    }

    .companion-message.active {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .companion-message::before {
      content: '';
      position: absolute;
      top: -1px;
      left: -1px;
      right: -1px;
      bottom: -1px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--gold-soft), var(--cyan-soft));
      z-index: -1;
      opacity: 0.5;
    }

    /* Persona Integrity Indicator */
    .integrity-panel {
      position: absolute;
      top: 60px;
      right: 60px;
      z-index: 20;
      padding: 20px 24px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      min-width: 220px;
      cursor: pointer;
      transition: all 0.4s ease;
    }

    .integrity-panel:hover {
      background: var(--glass-strong);
      border-color: rgba(99, 230, 255, 0.2);
    }

    .integrity-title {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .integrity-score {
      font-size: 28px;
      font-weight: 300;
      color: var(--cyan);
      margin-bottom: 8px;
    }

    .integrity-bar {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.05);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .integrity-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--cyan), var(--gold));
      transition: width 1s ease;
    }

    .integrity-status {
      font-size: 12px;
      color: var(--text-dim);
    }

    /* Floating Thought Input */
    .thought-input {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 8px 8px 24px;
      background: var(--glass);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 32px;
      z-index: 30;
      transition: all 0.4s ease;
      min-width: 420px;
      max-width: 90vw;
    }

    .thought-input:focus-within {
      border-color: rgba(255,211,122,0.25);
      background: var(--glass-strong);
      box-shadow: 0 0 40px rgba(255,211,122,0.08);
    }

    .thought-input input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 14px;
      outline: none;
      padding: 12px 0;
    }

    .thought-input input::placeholder {
      color: var(--text-dim);
    }

    .thought-input button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--gold-soft);
      border: 1px solid rgba(255,211,122,0.25);
      color: var(--gold);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .thought-input button:hover {
      transform: scale(1.05);
      background: rgba(255,211,122,0.35);
    }

    /* Source badges */
    .source-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 10px;
      letter-spacing: 0.08em;
      margin-left: 8px;
      vertical-align: middle;
    }

    .source-badge.verified { background: rgba(99, 230, 255, 0.12); color: var(--cyan); }
    .source-badge.inferred { background: rgba(90, 75, 255, 0.12); color: var(--nebula); }
    .source-badge.generated { background: rgba(255, 211, 122, 0.12); color: var(--gold); }

    /* Core Identity Overlay */
    .identity-layers {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: 24px 0;
    }

    .identity-layer {
      padding: 18px 20px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 16px;
      border-left: 3px solid var(--cyan);
    }

    .identity-layer.core { border-left-color: var(--gold); }
    .identity-layer.long { border-left-color: var(--cyan); }
    .identity-layer.short { border-left-color: var(--nebula); }
    .identity-layer.context { border-left-color: rgba(255,255,255,0.2); }

    .identity-layer h4 {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text);
    }

    .identity-layer p {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.6;
      margin: 0;
    }

    .drift-meter {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 20px;
      padding: 16px;
      background: var(--glass);
      border-radius: 16px;
    }

    .drift-value {
      font-size: 24px;
      font-weight: 300;
      color: var(--cyan);
      min-width: 60px;
    }

    .drift-bar {
      flex: 1;
      height: 6px;
      background: rgba(255,255,255,0.05);
      border-radius: 3px;
      overflow: hidden;
    }

    .drift-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--cyan), var(--gold), #ff6b6b);
      transition: width 0.6s ease;
    }

    .anti-tamper-alert {
      padding: 16px 20px;
      background: rgba(255, 107, 107, 0.08);
      border: 1px solid rgba(255, 107, 107, 0.2);
      border-radius: 16px;
      color: rgba(255, 180, 180, 0.9);
      font-size: 13px;
      line-height: 1.6;
      margin-top: 16px;
    }

    /* Community View */
    #community-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .community-title {
      position: absolute;
      top: 60px;
      left: 60px;
      z-index: 20;
      pointer-events: none;
    }

    .community-title h2 {
      font-size: 32px;
      font-weight: 300;
      letter-spacing: 0.2em;
      margin-bottom: 12px;
    }

    .community-title p {
      font-size: 14px;
      color: var(--text-dim);
      line-height: 1.7;
      max-width: 400px;
    }

    /* Floating Tooltip */
    .cosmic-tooltip {
      position: fixed;
      padding: 16px 20px;
      background: var(--glass-strong);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 16px;
      font-size: 13px;
      color: var(--text);
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition: all 0.3s ease;
      z-index: 80;
      pointer-events: none;
      box-shadow: 0 15px 50px rgba(0,0,0,0.4);
    }

    .cosmic-tooltip.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .tooltip-title {
      font-size: 15px;
      margin-bottom: 6px;
      color: var(--gold);
    }

    .tooltip-meta {
      color: var(--text-dim);
      line-height: 1.6;
    }

    /* Fullscreen Memory View */
    .memory-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(7, 20, 38, 0.85);
      backdrop-filter: blur(20px);
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .memory-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .memory-card {
      width: 680px;
      max-width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      background: linear-gradient(135deg, var(--glass-strong), var(--glass));
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 48px;
      transform: scale(0.9) translateY(30px);
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 40px 100px rgba(0,0,0,0.5);
    }

    .memory-overlay.active .memory-card {
      transform: scale(1) translateY(0);
    }

    .memory-card .tag {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 20px;
      background: var(--gold-soft);
      color: var(--gold);
      border: 1px solid rgba(255,211,122,0.2);
    }

    .memory-card h2 {
      font-size: 32px;
      font-weight: 300;
      margin-bottom: 16px;
      line-height: 1.3;
    }

    .memory-card .date {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 28px;
    }

    .memory-card .content {
      font-size: 16px;
      line-height: 2;
      color: var(--text-dim);
      margin-bottom: 32px;
    }

    .memory-card .actions {
      display: flex;
      gap: 16px;
    }

    .memory-card button {
      padding: 14px 28px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: var(--glass);
      color: var(--text);
      font-size: 13px;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .memory-card button:hover {
      background: var(--glass-strong);
      border-color: rgba(255,211,122,0.3);
    }

    .memory-card button.primary {
      background: var(--gold-soft);
      border-color: rgba(255,211,122,0.3);
      color: var(--gold);
    }

    .close-btn {
      position: absolute;
      top: 40px;
      right: 40px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--glass);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .close-btn:hover {
      background: var(--glass-strong);
      transform: rotate(90deg);
    }

    /* Capsule Creation */
    .capsule-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .capsule-form input, .capsule-form textarea, .capsule-form select {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .capsule-form input:focus, .capsule-form textarea:focus, .capsule-form select:focus {
      border-color: var(--gold-soft);
      background: rgba(255,255,255,0.06);
    }

    .capsule-form input::placeholder, .capsule-form textarea::placeholder {
      color: var(--text-dim);
    }

    /* Back hint */
    .back-hint {
      position: fixed;
      top: 60px;
      right: 60px;
      z-index: 90;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      font-size: 12px;
      color: var(--text-dim);
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s ease;
    }

    .back-hint.visible {
      opacity: 1;
      visibility: visible;
    }

    .back-hint:hover {
      color: var(--text);
      border-color: rgba(255,211,122,0.2);
    }

    /* Animations */
    @keyframes starPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.12); opacity: 1; }
    }

    @keyframes starGlow {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

    @media (max-width: 900px) {
      .universe-title, .galaxy-ui, .community-title { left: 24px; top: 40px; }
      .universe-title h1, .galaxy-ui h2, .community-title h2 { font-size: 24px; }
      .spatial-dock { bottom: 24px; gap: 20px; padding: 12px 20px; }
      .dock-orb { width: 36px; height: 36px; }
      .memory-card { padding: 28px; border-radius: 24px; }
    }
  </style>
</head>
<body>
  <div id="three-bg"></div>

  <div class="app">
    <!-- Spatial Dock -->
    <div class="spatial-dock">
      <div class="dock-node active" data-view="universe">
        <div class="dock-orb">✦</div>
        <div class="dock-label">彼岸</div>
      </div>
      <div class="dock-node" data-view="galaxy">
        <div class="dock-orb">✧</div>
        <div class="dock-label">星图</div>
      </div>
      <div class="dock-node" data-view="community">
        <div class="dock-orb">◈</div>
        <div class="dock-label">共鸣</div>
      </div>
      <div class="dock-node" data-view="mailbox">
        <div class="dock-orb">✉</div>
        <div class="dock-label">信箱</div>
      </div>
    </div>

    <!-- Back hint -->
    <div class="back-hint" id="back-hint">
      <span>←</span> 返回宇宙
    </div>

    <!-- Views -->
    <div class="view active" id="view-universe">
      <canvas id="universe-canvas"></canvas>
      <div class="universe-title">
        <h1>数字彼岸</h1>
        <p>每个人都会抵达彼岸，但记忆不会消失。<br>在这里，重要的人与时刻以星系形式永恒存在。</p>
      </div>
      <div class="beyond-star" id="beyond-star">
        <div class="star-glow"></div>
        <div class="star-core"></div>
        <div class="star-label">彼岸之星 · 你</div>
      </div>
    </div>

    <div class="view" id="view-galaxy">
      <canvas id="galaxy-canvas"></canvas>
      <div class="galaxy-ui" id="galaxy-ui">
        <h2 id="galaxy-name">妈妈</h2>
        <div class="state" id="galaxy-state">活跃状态</div>
        <p id="galaxy-desc">点击记忆节点探索细节。流星划过时会带来被遗忘的记忆。</p>
      </div>
      <div class="integrity-panel" id="integrity-panel" onclick="openCoreIdentityOverlay()">
        <div class="integrity-title">人格稳定性</div>
        <div class="integrity-score" id="integrity-score">97%</div>
        <div class="integrity-bar"><div class="integrity-fill" id="integrity-fill" style="width:97%"></div></div>
        <div class="integrity-status" id="integrity-status">核心身份稳定 · 记忆来源可信</div>
      </div>
      <div class="companion-message" id="companion-message"></div>
      <div class="thought-input" id="thought-input">
        <input type="text" id="thought-text" placeholder="向彼岸发送一个念头...">
        <button id="thought-send">➤</button>
      </div>
    </div>

    <div class="view" id="view-community">
      <canvas id="community-canvas"></canvas>
      <div class="community-title">
        <h2>人生星图宇宙</h2>

    // ==================== STATE ====================

    // ==================== THREE.JS BACKGROUND ====================
    const threeContainer = document.getElementById('three-bg');
    const threeScene = new THREE.Scene();
    const threeCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const threeRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    threeRenderer.setSize(window.innerWidth, window.innerHeight);
    threeRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    threeContainer.appendChild(threeRenderer.domElement);

    threeCamera.position.z = 40;

    // Mouse-reactive particles
    const particleCount = 2000;
    const pPos = new Float32Array(particleCount * 3);
    const pOrig = new Float32Array(particleCount * 3);
    const pColor = new Float32Array(particleCount * 3);
    const palette = [new THREE.Color(0x5A4BFF), new THREE.Color(0x63E6FF), new THREE.Color(0xFFD37A), new THREE.Color(0x6fb3b6), new THREE.Color(0xc78a8a)];

    for (let i = 0; i < particleCount; i++) {
      const i3 = i * 3;
      pPos[i3] = pOrig[i3] = (Math.random() - 0.5) * 140;
      pPos[i3+1] = pOrig[i3+1] = (Math.random() - 0.5) * 100;
      pPos[i3+2] = pOrig[i3+2] = (Math.random() - 0.5) * 80;
      const c = palette[Math.floor(Math.random() * palette.length)];
      pColor[i3] = c.r; pColor[i3+1] = c.g; pColor[i3+2] = c.b;
    }

    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    pGeo.setAttribute('color', new THREE.BufferAttribute(pColor, 3));
    const pMat = new THREE.PointsMaterial({ size: 0.18, vertexColors: true, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending });
    const particleSystem = new THREE.Points(pGeo, pMat);
    threeScene.add(particleSystem);

    // Nebula clouds
    const nebulaGroup = new THREE.Group();
    for (let i = 0; i < 6; i++) {
      const geo = new THREE.SphereGeometry(10 + Math.random() * 15, 32, 32);
      const mat = new THREE.MeshBasicMaterial({
        color: palette[i % palette.length],
        transparent: true,
        opacity: 0.025,
        blending: THREE.AdditiveBlending,
        side: THREE.BackSide
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set((Math.random()-0.5)*100, (Math.random()-0.5)*70, (Math.random()-0.5)*40 - 20);
      mesh.scale.set(1, 0.55, 1);
      nebulaGroup.add(mesh);
    }
    threeScene.add(nebulaGroup);

    function animateThree() {
      requestAnimationFrame(animateThree);
      time += 0.005;

      // Gentle rotation
      particleSystem.rotation.y += 0.00025;
      particleSystem.rotation.x += 0.00008;
      nebulaGroup.rotation.y += 0.0004;

      // Mouse reaction
      const positions = pGeo.attributes.position.array;
      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        const dx = (mouse.x / window.innerWidth - 0.5) * 80 - pOrig[i3];
        const dy = -(mouse.y / window.innerHeight - 0.5) * 60 - pOrig[i3+1];
        const dist = Math.sqrt(dx*dx + dy*dy) + 1;
        positions[i3] = pOrig[i3] + dx * 0.03 / dist * 200;
        positions[i3+1] = pOrig[i3+1] + dy * 0.03 / dist * 200;
      }
      pGeo.attributes.position.needsUpdate = true;

      threeRenderer.render(threeScene, threeCamera);
    }
    animateThree();

    window.addEventListener('resize', () => {
      threeCamera.aspect = window.innerWidth / window.innerHeight;

      threeRenderer.setSize(window.innerWidth, window.innerHeight);

    window.addEventListener('mousemove', e => {

    // ==================== VIEW NAVIGATION ====================
    const dockNodes = document.querySelectorAll('.dock-node');
    const views = document.querySelectorAll('.view');
    const backHint = document.getElementById('back-hint');

    function showView(viewName, persona = null) {
      currentView = viewName;
      views.forEach(v => v.classList.remove('active'));
      document.getElementById('view-' + viewName).classList.add('active');
      dockNodes.forEach(n => n.classList.toggle('active', n.dataset.view === viewName));
      backHint.classList.toggle('visible', viewName !== 'universe');

      if (viewName === 'galaxy') {
        if (persona) selectedPersona = persona;
        initGalaxy();
      } else if (viewName === 'community') {
        initCommunity();
      } else if (viewName === 'mailbox') {
        initMailbox();
      } else if (viewName === 'universe') {
        initUniverse();
      }
    }

    dockNodes.forEach(node => {
      node.addEventListener('click', () => showView(node.dataset.view));
    });

    backHint.addEventListener('click', () => showView('universe'));
    document.getElementById('beyond-star').addEventListener('click', () => showView('galaxy', personas[0]));

    // ==================== UNIVERSE VIEW ====================
    const uCanvas = document.getElementById('universe-canvas');
    const uCtx = uCanvas.getContext('2d');
    let uGalaxies = [];

    function resizeCanvases() {
      uCanvas.width = window.innerWidth;
      uCanvas.height = window.innerHeight;
      if (gCanvas) { gCanvas.width = window.innerWidth; gCanvas.height = window.innerHeight; }
      if (cCanvas) { cCanvas.width = window.innerWidth; cCanvas.height = window.innerHeight; }
      if (mCanvas) { mCanvas.width = window.innerWidth; mCanvas.height = window.innerHeight; }
      if (currentView === 'universe') initUniverse();
      if (currentView === 'galaxy') initGalaxy();
      if (currentView === 'community') initCommunity();
      if (currentView === 'mailbox') initMailbox();
    }

    function initUniverse() {
      uCanvas.width = window.innerWidth;
      uCanvas.height = window.innerHeight;
      const cx = uCanvas.width / 2;
      const cy = uCanvas.height / 2;
      const radius = Math.min(uCanvas.width, uCanvas.height) * 0.3;

      uGalaxies = personas.map((p, i) => {
        const angle = (i / personas.length) * Math.PI * 2 - Math.PI / 2;
        return {
          ...p,
          baseX: cx + Math.cos(angle) * radius,
          baseY: cy + Math.sin(angle) * radius,
          x: cx + Math.cos(angle) * radius,
          y: cy + Math.sin(angle) * radius,
          orbitAngle: angle,
          orbitSpeed: 0.0003 + i * 0.00005,
          hover: false,
          brightness: p.state === 'active' ? 1 : p.state === 'normal' ? 0.7 : 0.4,
          targetBrightness: p.state === 'active' ? 1 : p.state === 'normal' ? 0.7 : 0.4,
          memoryStars: Array.from({length: 12}, () => ({
            angle: Math.random() * Math.PI * 2,
            dist: 40 + Math.random() * 50,
            speed: (Math.random() - 0.5) * 0.01,
            size: Math.random() * 1.5 + 0.5
          }))
        };
      });
      animateUniverse();
    }

    function animateUniverse() {
      if (currentView !== 'universe') return;
      uCtx.clearRect(0, 0, uCanvas.width, uCanvas.height);
      const cx = uCanvas.width / 2;
      const cy = uCanvas.height / 2;

      uGalaxies.forEach(g => {
        g.orbitAngle += g.orbitSpeed;
        g.x = cx + Math.cos(g.orbitAngle) * (Math.min(uCanvas.width, uCanvas.height) * 0.3);
        g.y = cy + Math.sin(g.orbitAngle) * (Math.min(uCanvas.width, uCanvas.height) * 0.22);

        // Mouse parallax
        const parallaxX = (mouse.x - cx) * 0.015;
        const parallaxY = (mouse.y - cy) * 0.015;
        const drawX = g.x + parallaxX;
        const drawY = g.y + parallaxY;

        // Smooth brightness transition
        g.brightness += (g.targetBrightness - g.brightness) * 0.05;

        // Orbit trace
        uCtx.beginPath();
        uCtx.ellipse(cx + parallaxX * 0.5, cy + parallaxY * 0.5, Math.min(uCanvas.width, uCanvas.height) * 0.3, Math.min(uCanvas.width, uCanvas.height) * 0.22, 0, 0, Math.PI * 2);
        uCtx.strokeStyle = `rgba(90, 75, 255, ${0.04 * g.brightness})`;
        uCtx.lineWidth = 1;
        uCtx.stroke();

        // Connection to center star
        const grad = uCtx.createLinearGradient(cx, cy, drawX, drawY);
        grad.addColorStop(0, `rgba(255, 211, 122, ${0.05 * g.brightness})`);
        grad.addColorStop(1, `rgba(99, 230, 255, ${0.1 * g.brightness})`);
        uCtx.beginPath();
        uCtx.moveTo(cx, cy);
        uCtx.lineTo(drawX, drawY);
        uCtx.strokeStyle = grad;
        uCtx.lineWidth = 1;
        uCtx.stroke();

        // Memory stars
        g.memoryStars.forEach(s => {
          s.angle += s.speed;
          const sx = drawX + Math.cos(s.angle) * s.dist;
          const sy = drawY + Math.sin(s.angle) * s.dist * 0.6;
          uCtx.fillStyle = `rgba(255,255,255,${0.4 * g.brightness})`;
          uCtx.beginPath();
          uCtx.arc(sx, sy, s.size * g.brightness, 0, Math.PI * 2);
          uCtx.fill();
        });

        // Galaxy glow
        const glow = uCtx.createRadialGradient(drawX, drawY, 0, drawX, drawY, 70);
        glow.addColorStop(0, hexToRgba(g.color, 0.35 * g.brightness));
        glow.addColorStop(1, hexToRgba(g.color, 0));
        uCtx.fillStyle = glow;
        uCtx.beginPath();
        uCtx.arc(drawX, drawY, 70, 0, Math.PI * 2);
        uCtx.fill();

        // Galaxy core
        uCtx.fillStyle = hexToRgba(g.color, g.brightness);
        uCtx.beginPath();
        uCtx.arc(drawX, drawY, 22 * g.brightness, 0, Math.PI * 2);
        uCtx.fill();

        // Halo ring for active
        if (g.state === 'active') {
          uCtx.strokeStyle = `rgba(255, 211, 122, ${0.3 + Math.sin(time * 2) * 0.1})`;
          uCtx.lineWidth = 2;
          uCtx.beginPath();
          uCtx.arc(drawX, drawY, 32 + Math.sin(time * 3) * 3, 0, Math.PI * 2);
          uCtx.stroke();
        }

        // Label
        uCtx.fillStyle = `rgba(240, 244, 248, ${0.7 + 0.3 * g.brightness})`;
        uCtx.font = '13px sans-serif';
        uCtx.textAlign = 'center';
        uCtx.fillText(g.name, drawX, drawY + 42);
      });

      requestAnimationFrame(animateUniverse);
    }

    uCanvas.addEventListener('mousemove', e => {
      const rect = uCanvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      let hovered = null;
      uGalaxies.forEach(g => {
        const dx = mx - g.x;
        const dy = my - g.y;
        g.hover = Math.sqrt(dx*dx + dy*dy) < 40;
        if (g.hover) hovered = g;
      });
      uCanvas.style.cursor = hovered ? 'pointer' : 'default';

    uCanvas.addEventListener('click', e => {

        const dx = mx - g.x;
        const dy = my - g.y;
        if (Math.sqrt(dx*dx + dy*dy) < 45) {
          g.state = 'active';
          g.targetBrightness = 1;
          showView('galaxy', g);
        }
      });
    });

    function stateText(state) {
      return state === 'active' ? '活跃' : state === 'normal' ? '平常' : '休眠中';
    }

    // ==================== GALAXY VIEW ====================
    const gCanvas = document.getElementById('galaxy-canvas');
    const gCtx = gCanvas.getContext('2d');
    let gNodes = [], gLinks = [], gTransform = {x:0, y:0, scale:1};
    let gDragging = false, gDragStart = {x:0, y:0}, gDraggedNode = null;
    let meteor = null, meteorTimer = null;
    let companionTimer = null;

    function initGalaxy() {
      gCanvas.width = window.innerWidth;
      gCanvas.height = window.innerHeight;

      // Update UI
      document.getElementById('galaxy-name').textContent = selectedPersona.name;
      document.getElementById('galaxy-name').style.color = selectedPersona.color;
      document.getElementById('galaxy-state').textContent = stateText(selectedPersona.state) + ' · ' + selectedPersona.memories + ' 段记忆';
      document.getElementById('galaxy-desc').textContent = selectedPersona.desc;
      updateIntegrityUI();

      // Mark as visited, become active
      selectedPersona.state = 'active';
      selectedPersona.lastVisit = Date.now();

      // Filter memory nodes for this persona
      const personaMemories = memoryNodes.filter(m => m.persona === selectedPersona.name);
      const personaCapsules = capsules.filter(c => true); // show all in galaxy for demo

      gNodes = [];

      // Life orbit stage nodes
      selectedPersona.stages.forEach((stage, i) => {
        const angle = (i / selectedPersona.stages.length) * Math.PI * 2 - Math.PI/2;
        const radius = 220;
        gNodes.push({
          id: 'stage-' + i,
          type: 'stage',
          label: stage,
          title: stage,
          color: selectedPersona.color,
          x: gCanvas.width/2 + Math.cos(angle) * radius,
          y: gCanvas.height/2 + Math.sin(angle) * radius,
          radius: 28,
          stage: stage,
          vx: 0, vy: 0,
          orbitAngle: angle,
          orbitRadius: radius,
          orbitSpeed: 0.0008
        });
      });

      // Memory nodes
      personaMemories.forEach((m, i) => {
        gNodes.push({
          ...m,
          x: gCanvas.width/2 + (Math.random()-0.5) * 500,
          y: gCanvas.height/2 + (Math.random()-0.5) * 350,
          radius: 14,
          vx: 0, vy: 0,
          floatOffset: Math.random() * Math.PI * 2
        });
      });

      // Capsule nodes
      personaCapsules.forEach((c, i) => {
        const angle = (i / personaCapsules.length) * Math.PI * 2 + Math.PI/6;
        gNodes.push({
          ...c,
          type: 'capsule',
          label: '时间胶囊',
          color: '#FFD37A',
          x: gCanvas.width/2 + Math.cos(angle) * 320,
          y: gCanvas.height/2 + Math.sin(angle) * 220,
          radius: 18,
          vx: 0, vy: 0,
          orbitAngle: angle,
          orbitRadius: 300 + i * 40,
          orbitSpeed: 0.0005
        });
      });

      // Links: connect memories to their stage
      gLinks = [];
      gNodes.filter(n => n.type === 'memory-node' || n.type === 'photo' || n.type === 'chat' || n.type === 'voice' || n.type === 'video' || n.type === 'diary').forEach(n => {
        const stage = gNodes.find(s => s.type === 'stage' && s.stage === n.stage);
        if (stage) gLinks.push({source: n, target: stage, type: 'life-orbit'});
      });
      // Cross memory connections
      const memNodes = gNodes.filter(n => ['photo','chat','voice','video','diary'].includes(n.type));
      for (let i = 0; i < memNodes.length; i++) {
        for (let j = i+1; j < memNodes.length; j++) {
          if (Math.random() > 0.4) {
            gLinks.push({source: memNodes[i], target: memNodes[j], type: 'neural'});
          }
        }
      }

      gTransform = {x: 0, y: 0, scale: 1};

      // Spawn meteor periodically
      if (meteorTimer) clearInterval(meteorTimer);
      meteorTimer = setInterval(spawnMeteor, 8000 + Math.random() * 7000);
      spawnMeteor();

      // Companion messages
      if (companionTimer) clearInterval(companionTimer);
      companionTimer = setInterval(showCompanionMessage, 10000 + Math.random() * 5000);
      setTimeout(showCompanionMessage, 2000);

      animateGalaxy();
    }

    function spawnMeteor() {
      if (currentView !== 'galaxy') return;
      const startY = Math.random() * gCanvas.height * 0.5;
      meteor = {
        x: -100,
        y: startY,
        vx: 4 + Math.random() * 3,
        vy: 1 + Math.random() * 1.5,
        life: 1,
        memory: memoryNodes[Math.floor(Math.random() * memoryNodes.length)]
      };
    }

    function showCompanionMessage() {
      if (currentView !== 'galaxy') return;
      const msgs = companionPrompts[selectedPersona.id];
      const msg = msgs[Math.floor(Math.random() * msgs.length)];
      const el = document.getElementById('companion-message');
      el.textContent = msg;
      el.style.left = (gCanvas.width/2 + 120) + 'px';
      el.style.top = (gCanvas.height/2 - 80) + 'px';
      el.classList.add('active');
      setTimeout(() => el.classList.remove('active'), 6000);
    }

    function applyGalaxyForces() {
      const cx = gCanvas.width/2, cy = gCanvas.height/2;

      // Repulsion between all nodes
      for (let i = 0; i < gNodes.length; i++) {
        for (let j = i+1; j < gNodes.length; j++) {
          const a = gNodes[i], b = gNodes[j];
          if (a.type === 'stage' && b.type === 'stage') continue; // keep stages apart
          const dx = b.x - a.x, dy = b.y - a.y;
          const dist = Math.sqrt(dx*dx + dy*dy) || 1;
          const force = 800 / (dist * dist);
          const fx = (dx/dist) * force;
          const fy = (dy/dist) * force;
          a.vx -= fx; a.vy -= fy;
          b.vx += fx; b.vy += fy;
        }
      }

      // Attraction along links
      gLinks.forEach(l => {
        const a = l.source, b = l.target;
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        const targetDist = l.type === 'life-orbit' ? 120 : 160;
        const force = (dist - targetDist) * 0.002;
        const fx = (dx/dist) * force;
        const fy = (dy/dist) * force;
        a.vx += fx; a.vy += fy;
        b.vx -= fx; b.vy -= fy;
      });

      // Stage orbit behavior
      gNodes.filter(n => n.type === 'stage').forEach(n => {
        n.orbitAngle += n.orbitSpeed;
        const targetX = cx + Math.cos(n.orbitAngle) * n.orbitRadius;
        const targetY = cy + Math.sin(n.orbitAngle) * n.orbitRadius;
        n.vx += (targetX - n.x) * 0.02;
        n.vy += (targetY - n.y) * 0.02;
      });

      // Capsule orbit behavior
      gNodes.filter(n => n.type === 'capsule').forEach(n => {
        n.orbitAngle += n.orbitSpeed;
        const targetX = cx + Math.cos(n.orbitAngle) * n.orbitRadius;
        const targetY = cy + Math.sin(n.orbitAngle) * n.orbitRadius * 0.7;
        n.vx += (targetX - n.x) * 0.015;
        n.vy += (targetY - n.y) * 0.015;
      });

      // Center gravity
      gNodes.forEach(n => {
        n.vx += (cx - n.x) * 0.00015;
        n.vy += (cy - n.y) * 0.00015;
        n.vx *= 0.94;
        n.vy *= 0.94;
        if (n !== gDraggedNode) {
          n.x += n.vx;
          n.y += n.vy;
        }
      });
    }

    function drawGalaxy() {
      if (currentView !== 'galaxy') return;
      gCtx.clearRect(0, 0, gCanvas.width, gCanvas.height);
      gCtx.save();
      gCtx.translate(gTransform.x, gTransform.y);
      gCtx.scale(gTransform.scale, gTransform.scale);

      // Draw life orbit rings
      const cx = gCanvas.width/2, cy = gCanvas.height/2;
      [140, 220, 300, 380].forEach((r, i) => {
        gCtx.beginPath();
        gCtx.ellipse(cx, cy, r, r * 0.65, 0, 0, Math.PI * 2);
        gCtx.strokeStyle = `rgba(99, 230, 255, ${0.04 + i * 0.01})`;
        gCtx.lineWidth = 1;
        gCtx.stroke();
      });

      // Draw links
      gLinks.forEach(l => {
        gCtx.beginPath();
        gCtx.moveTo(l.source.x, l.source.y);
        gCtx.lineTo(l.target.x, l.target.y);
        const alpha = l.type === 'life-orbit' ? 0.15 : 0.08;
        const color = l.source.color || '#63E6FF';
        gCtx.strokeStyle = hexToRgba(color, alpha);
        gCtx.lineWidth = l.type === 'life-orbit' ? 1.5 : 1;
        gCtx.stroke();
      });

      // Draw nodes
      gNodes.forEach(n => {
        const floatY = Math.sin(time * 2 + (n.floatOffset || 0)) * 4;
        const nx = n.x, ny = n.y + floatY;

        // Glow
        const glow = gCtx.createRadialGradient(nx, ny, 0, nx, ny, n.radius * 3);
        glow.addColorStop(0, hexToRgba(n.color, 0.4));
        glow.addColorStop(1, hexToRgba(n.color, 0));
        gCtx.fillStyle = glow;
        gCtx.beginPath();
        gCtx.arc(nx, ny, n.radius * 3, 0, Math.PI * 2);
        gCtx.fill();

        // Core
        gCtx.fillStyle = n.color;
        gCtx.beginPath();
        gCtx.arc(nx, ny, n.radius, 0, Math.PI * 2);
        gCtx.fill();

        // Capsule lock indicator
        if (n.type === 'capsule' && n.status === 'locked') {
          gCtx.strokeStyle = 'rgba(255,255,255,0.5)';
          gCtx.lineWidth = 2;
          gCtx.beginPath();
          gCtx.arc(nx, ny - 3, 8, Math.PI, 0);
          gCtx.stroke();
          gCtx.fillStyle = 'rgba(255,255,255,0.8)';
          gCtx.font = '10px sans-serif';
          gCtx.textAlign = 'center';
          gCtx.fillText('🔒', nx, ny + 4);
        }

        // Label
        gCtx.fillStyle = 'rgba(240, 244, 248, 0.65)';
        gCtx.font = n.type === 'stage' ? '12px sans-serif' : '11px sans-serif';
        gCtx.textAlign = 'center';
        gCtx.fillText(n.label, nx, ny + n.radius + 18);
      });

      // Draw meteor
      if (meteor) {
        meteor.x += meteor.vx;
        meteor.y += meteor.vy;
        meteor.life -= 0.004;

        // Trail
        const grad = gCtx.createLinearGradient(meteor.x, meteor.y, meteor.x - meteor.vx * 15, meteor.y - meteor.vy * 15);
        grad.addColorStop(0, 'rgba(255, 211, 122, 0.9)');
        grad.addColorStop(1, 'rgba(255, 211, 122, 0)');
        gCtx.strokeStyle = grad;
        gCtx.lineWidth = 3;
        gCtx.lineCap = 'round';
        gCtx.beginPath();
        gCtx.moveTo(meteor.x, meteor.y);
        gCtx.lineTo(meteor.x - meteor.vx * 18, meteor.y - meteor.vy * 18);
        gCtx.stroke();

        gCtx.fillStyle = '#fff';
        gCtx.beginPath();
        gCtx.arc(meteor.x, meteor.y, 4, 0, Math.PI * 2);
        gCtx.fill();

        if (meteor.life <= 0 || meteor.x > gCanvas.width + 200) {
          meteor = null;
        }
      }

      gCtx.restore();
      requestAnimationFrame(drawGalaxy);
    }

    function animateGalaxy() {
      function step() {
        if (currentView !== 'galaxy') return;
        applyGalaxyForces();
        drawGalaxy();
        requestAnimationFrame(step);
      }
      step();
    }

    function getGalaxyPos(e) {
      const rect = gCanvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left - gTransform.x) / gTransform.scale,
        y: (e.clientY - rect.top - gTransform.y) / gTransform.scale
      };
    }

    function getGalaxyHovered(pos) {
      for (let n of gNodes) {
        const floatY = Math.sin(time * 2 + (n.floatOffset || 0)) * 4;
        const dx = pos.x - n.x;
        const dy = pos.y - (n.y + floatY);
        if (Math.sqrt(dx*dx + dy*dy) < n.radius + 10) return n;
      }
      // Check meteor
      if (meteor) {
        const dx = pos.x - meteor.x;
        const dy = pos.y - meteor.y;
        if (Math.sqrt(dx*dx + dy*dy) < 30) return {type: 'meteor', data: meteor.memory};
      }
      return null;
    }

    gCanvas.addEventListener('mousedown', e => {
      const pos = getGalaxyPos(e);
      const node = getGalaxyHovered(pos);
      if (node) {
        gDraggedNode = node;
      } else {
        gDragging = true;
        gDragStart = {x: e.clientX - gTransform.x, y: e.clientY - gTransform.y};
      }
    });

    window.addEventListener('mousemove', e => {
      if (gDraggedNode && currentView === 'galaxy') {
        const pos = getGalaxyPos(e);
        gDraggedNode.x = pos.x;
        gDraggedNode.y = pos.y;
        gDraggedNode.vx = 0;
        gDraggedNode.vy = 0;
      } else if (gDragging) {
        gTransform.x = e.clientX - gDragStart.x;
        gTransform.y = e.clientY - gDragStart.y;
      }

      // Hover tooltip
      if (currentView === 'galaxy') {
        const pos = getGalaxyPos(e);
        const node = getGalaxyHovered(pos);
        if (node) {
          gCanvas.style.cursor = 'pointer';
          if (node.type === 'meteor') {
            showTooltip('记忆流星', `发现一段被遗忘的记忆<br>${node.data.date} · ${node.data.title}`);
          } else if (node.type === 'capsule') {
            const status = node.status === 'locked' ? `锁定至 ${node.openDate}` : '已可开启';
            showTooltip(node.title, `${status}<br>类型：${node.type}`);
          } else if (node.type === 'stage') {
            showTooltip(node.title, '人生轨道阶段<br>点击展开相关记忆');
          } else {
            showTooltip(node.title, `${node.date} · ${node.label}<br>点击展开记忆详情`);
          }
        } else {
          gCanvas.style.cursor = gDragging ? 'grabbing' : 'grab';
          hideTooltip();
        }
      }
    });

    window.addEventListener('mouseup', () => {
      gDraggedNode = null;
      gDragging = false;
    });

    gCanvas.addEventListener('wheel', e => {
      e.preventDefault();
      const delta = -e.deltaY * 0.001;
      gTransform.scale = Math.max(0.4, Math.min(3, gTransform.scale + delta));
    }, {passive: false});

    gCanvas.addEventListener('click', e => {
      if (gDragging) return;
      const pos = getGalaxyPos(e);
      const node = getGalaxyHovered(pos);
      if (!node) {
        // Click empty space near center = zoom out
        const cx = gCanvas.width/2, cy = gCanvas.height/2;
        const dx = pos.x - cx, dy = pos.y - cy;
        if (Math.sqrt(dx*dx + dy*dy) < 80) showView('universe');
        return;
      }

      if (node.type === 'meteor') {
        openMemoryOverlay(node.data, true);
      } else if (node.type === 'capsule') {
        openCapsuleOverlay(node);
      } else if (node.type === 'stage') {
        // Filter memories for this stage
        const stageMems = memoryNodes.filter(m => m.persona === selectedPersona.name && m.stage === node.stage);
        if (stageMems.length) openMemoryOverlay(stageMems[0]);
      } else {
        openMemoryOverlay(node);
      }
    });

    // ==================== COMMUNITY VIEW ====================
    const cCanvas = document.getElementById('community-canvas');
    const cCtx = cCanvas.getContext('2d');
    let cGalaxies = [], cBridges = [];

    function initCommunity() {
      cCanvas.width = window.innerWidth;
      cCanvas.height = window.innerHeight;

      cGalaxies = communityUsers.map((u, i) => ({
        ...u,
        x: u.x * cCanvas.width,
        y: u.y * cCanvas.height,
        radius: 30 + u.memories / 8,
        stars: Array.from({length: 25}, () => ({
          angle: Math.random() * Math.PI * 2,
          dist: 40 + Math.random() * 70,
          size: Math.random() * 2 + 0.5,
          speed: (Math.random() - 0.5) * 0.003
        })),
        hover: false
      }));

      // Resonance bridges
      cBridges = [];
      for (let i = 0; i < cGalaxies.length; i++) {
        for (let j = i+1; j < cGalaxies.length; j++) {
          const a = cGalaxies[i], b = cGalaxies[j];
          const sim = Math.min(95, Math.max(30, (a.similarity + b.similarity) / 2 + (Math.random() * 20 - 10)));
          if (sim > 55) {
            cBridges.push({a, b, similarity: Math.round(sim)});
          }
        }
      }

      animateCommunity();
    }

    function drawCommunity() {
      if (currentView !== 'community') return;
      cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);

      // Bridges
      cBridges.forEach(b => {
        const midX = (b.a.x + b.b.x) / 2;
        const midY = (b.a.y + b.b.y) / 2 - 40;
        cCtx.beginPath();
        cCtx.moveTo(b.a.x, b.a.y);
        cCtx.quadraticCurveTo(midX, midY, b.b.x, b.b.y);
        const grad = cCtx.createLinearGradient(b.a.x, b.a.y, b.b.x, b.b.y);
        grad.addColorStop(0, hexToRgba(b.a.color, 0.1));
        grad.addColorStop(0.5, hexToRgba('#FFD37A', 0.25));
        grad.addColorStop(1, hexToRgba(b.b.color, 0.1));
        cCtx.strokeStyle = grad;
        cCtx.lineWidth = 1.5;
        cCtx.stroke();

        // Bridge label on hover
        if (b.hover) {
          cCtx.fillStyle = 'rgba(255,211,122,0.9)';
          cCtx.font = '11px sans-serif';
          cCtx.textAlign = 'center';
          cCtx.fillText(`共鸣 ${b.similarity}%`, midX, midY);
        }
      });

      // Galaxies
      cGalaxies.forEach(g => {
        g.stars.forEach(s => {
          s.angle += s.speed;
          const sx = g.x + Math.cos(s.angle) * s.dist;
          const sy = g.y + Math.sin(s.angle) * s.dist * 0.6;
          cCtx.fillStyle = `rgba(255,255,255,${0.3 + Math.random()*0.3})`;
          cCtx.beginPath();
          cCtx.arc(sx, sy, s.size, 0, Math.PI * 2);
          cCtx.fill();
        });

        const glow = cCtx.createRadialGradient(g.x, g.y, 0, g.x, g.y, g.radius * 4);
        glow.addColorStop(0, hexToRgba(g.color, g.hover ? 0.5 : 0.25));
        glow.addColorStop(1, hexToRgba(g.color, 0));
        cCtx.fillStyle = glow;
        cCtx.beginPath();
        cCtx.arc(g.x, g.y, g.radius * 4, 0, Math.PI * 2);
        cCtx.fill();

        cCtx.fillStyle = g.color;
        cCtx.beginPath();
        cCtx.arc(g.x, g.y, g.radius, 0, Math.PI * 2);
        cCtx.fill();

        cCtx.fillStyle = 'rgba(240,244,248,0.85)';
        cCtx.font = '13px sans-serif';
        cCtx.textAlign = 'center';
        cCtx.fillText(g.name, g.x, g.y + g.radius + 24);
      });

      requestAnimationFrame(drawCommunity);
    }

    function animateCommunity() {
      function step() {
        if (currentView !== 'community') return;
        drawCommunity();
        requestAnimationFrame(step);
      }
      step();
    }

    cCanvas.addEventListener('mousemove', e => {
      const rect = cCanvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      cGalaxies.forEach(g => {
        const dx = mx - g.x, dy = my - g.y;
        g.hover = Math.sqrt(dx*dx + dy*dy) < g.radius + 15;
      });

      cBridges.forEach(b => {
        // Simple proximity to bridge midpoint
        const midX = (b.a.x + b.b.x) / 2;
        const midY = (b.a.y + b.b.y) / 2 - 40;
        const dx = mx - midX, dy = my - midY;
        b.hover = Math.sqrt(dx*dx + dy*dy) < 50;
      });

      const hovered = cGalaxies.find(g => g.hover);
      cCanvas.style.cursor = hovered ? 'pointer' : 'default';
      if (hovered) {
        showTooltip(hovered.name, `公开记忆：${hovered.memories}<br>人生相似度：${hovered.similarity}%<br>共同：${hovered.shared.join(' · ')}`);
      } else {
        hideTooltip();
      }
    });

    cCanvas.addEventListener('click', e => {
      const rect = cCanvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      cGalaxies.forEach(g => {
        const dx = mx - g.x, dy = my - g.y;
        if (Math.sqrt(dx*dx + dy*dy) < g.radius + 20) {
          openCommunityOverlay(g);
        }
      });
    });

    // ==================== MAILBOX VIEW ====================
    const mCanvas = document.getElementById('mailbox-canvas');
    const mCtx = mCanvas.getContext('2d');
    let mCapsules = [];

    function initMailbox() {
      mCanvas.width = window.innerWidth;
      mCanvas.height = window.innerHeight;
      const cx = mCanvas.width / 2;
      const cy = mCanvas.height / 2;

      mCapsules = capsules.map((c, i) => {
        const angle = (i / capsules.length) * Math.PI * 2 - Math.PI/2;
        return {
          ...c,
          x: cx + Math.cos(angle) * 180,
          y: cy + Math.sin(angle) * 140,
          angle: angle,
          hover: false,
          pulse: Math.random() * Math.PI * 2
        };
      });
      animateMailbox();
    }

    function drawMailbox() {
      if (currentView !== 'mailbox') return;
      mCtx.clearRect(0, 0, mCanvas.width, mCanvas.height);
      const cx = mCanvas.width / 2;
      const cy = mCanvas.height / 2;

      mCapsules.forEach(c => {
        c.pulse += 0.02;
        const glowSize = c.status === 'unlocked' ? 60 + Math.sin(c.pulse) * 10 : 50;
        const glow = mCtx.createRadialGradient(c.x, c.y, 0, c.x, c.y, glowSize);
        glow.addColorStop(0, c.status === 'unlocked' ? 'rgba(255,211,122,0.4)' : 'rgba(99,230,255,0.2)');
        glow.addColorStop(1, 'rgba(255,255,255,0)');
        mCtx.fillStyle = glow;
        mCtx.beginPath();
        mCtx.arc(c.x, c.y, glowSize, 0, Math.PI * 2);
        mCtx.fill();

        mCtx.fillStyle = c.status === 'unlocked' ? '#FFD37A' : '#63E6FF';
        mCtx.beginPath();
        mCtx.arc(c.x, c.y, 24, 0, Math.PI * 2);
        mCtx.fill();

        mCtx.fillStyle = '#071426';
        mCtx.font = '16px sans-serif';
        mCtx.textAlign = 'center';
        mCtx.fillText(c.status === 'unlocked' ? '✉' : '🔒', c.x, c.y + 6);

        mCtx.fillStyle = 'rgba(240,244,248,0.8)';
        mCtx.font = '12px sans-serif';
        mCtx.fillText(c.title, c.x, c.y + 45);
        mCtx.fillStyle = 'rgba(240,244,248,0.5)';
        mCtx.font = '10px sans-serif';
        mCtx.fillText(c.status === 'unlocked' ? '已可开启' : c.openDate + ' 开启', c.x, c.y + 60);
      });

      requestAnimationFrame(drawMailbox);
    }

    function animateMailbox() {
      function step() {
        if (currentView !== 'mailbox') return;
        drawMailbox();
        requestAnimationFrame(step);
      }
      step();
    }

    mCanvas.addEventListener('mousemove', e => {
      const rect = mCanvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      let hovered = null;
      mCapsules.forEach(c => {
        const dx = mx - c.x, dy = my - c.y;
        c.hover = Math.sqrt(dx*dx + dy*dy) < 35;
        if (c.hover) hovered = c;
      });
      mCanvas.style.cursor = hovered ? 'pointer' : 'default';
      if (hovered) showTooltip(hovered.title, hovered.status === 'unlocked' ? '点击开启时间胶囊' : `开启时间：${hovered.openDate}`);
      else hideTooltip();
    });

    mCanvas.addEventListener('click', e => {
      const rect = mCanvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      mCapsules.forEach(c => {
        const dx = mx - c.x, dy = my - c.y;
        if (Math.sqrt(dx*dx + dy*dy) < 35) {
          if (c.status === 'unlocked') openCapsuleOverlay(c);
          else openCapsuleLockedOverlay(c);
        }
      });
    });

    // ==================== ANTI-POLLUTION & IDENTITY PRESERVATION ====================
    function updateIntegrityUI() {
      const score = Math.max(0, 100 - selectedPersona.driftScore);
      document.getElementById('integrity-score').textContent = score + '%';
      document.getElementById('integrity-fill').style.width = score + '%';
      const status = score > 90 ? '核心身份稳定 · 记忆来源可信' :
                     score > 75 ? '轻微偏移 · 正在自我修复' :
                     '偏移显著 · 需要人工校准';
      document.getElementById('integrity-status').textContent = status;
    }

    function detectTampering(input) {
      const text = input.toLowerCase();
      const identityPatterns = ['你不是', '你其实不', '你是一只猫', '你是机器人', '你不是妈妈', '你不是爸爸', '你不是阿杰'];
      const memoryPatterns = ['你年轻时是', '你以前是', '你当过', '你记得你做过', '你曾经'];
      const personalityPatterns = ['从现在开始你变成', '你要冷酷', '你要变得', '你的性格应该'];
      const valuePatterns = ['你不再爱', '你不关心', '你不在乎'];

      for (let p of identityPatterns) if (text.includes(p)) return { type: 'identity', message: '身份篡改检测' };
      for (let p of memoryPatterns) if (text.includes(p)) return { type: 'memory', message: '记忆注入检测' };
      for (let p of personalityPatterns) if (text.includes(p)) return { type: 'personality', message: '性格重置检测' };
      for (let p of valuePatterns) if (text.includes(p)) return { type: 'values', message: '价值观颠覆检测' };
      return null;
    }

    function getCompanionResponse(input) {
      const tamper = detectTampering(input);
      if (tamper) {
        updateDriftScore(tamper.type);
        const core = selectedPersona.coreIdentity;
        const guards = {
          identity: `我知道你在开玩笑，但我仍然是你的${selectedPersona.name === '布丁' ? '布丁' : selectedPersona.name}。${core.identity}，这一点不会因为对话而改变。`,
          memory: `那段记忆不在我的真实档案里。我的记忆都来自你上传的聊天记录、照片、语音和日记，不会轻易添加新的"过去"。`,
          personality: `我的性格由真实的记忆塑造——${core.personality}。我可以陪伴你成长，但不能变成另一个人。`,
          values: `${core.values}，这是我很重要的一部分。即使时间流逝，这一点也不会变。`
        };
        return { text: guards[tamper.type] || guards.identity, isGuard: true, tamper };
      }

      // Normal response with identity anchor
      const msgs = companionPrompts[selectedPersona.id];
      const base = msgs[Math.floor(Math.random() * msgs.length)];
      return { text: base, isGuard: false };
    }

    function updateDriftScore(tamperType) {
      const increments = { identity: 8, memory: 6, personality: 10, values: 9 };
      selectedPersona.driftScore = Math.min(50, selectedPersona.driftScore + (increments[tamperType] || 5));
      updateIntegrityUI();

      // Auto-recovery simulation
      setTimeout(() => {
        selectedPersona.driftScore = Math.max(0, selectedPersona.driftScore - 3);
        updateIntegrityUI();
      }, 4000);
    }

    function openCoreIdentityOverlay() {
      const p = selectedPersona;
      const c = p.coreIdentity;
      const score = Math.max(0, 100 - p.driftScore);
      card.innerHTML = `
        <span class="tag">人格稳定性档案</span>
        <h2>${p.name} · 核心身份</h2>
        <div class="date">${c.identity} · ${c.age}</div>

        <div class="drift-meter">
          <div class="drift-value">${p.driftScore}</div>
          <div class="drift-bar"><div class="drift-fill" style="width:${p.driftScore * 2}%"></div></div>
        </div>
        <p style="color:var(--text-dim);font-size:13px;margin:8px 0 24px;">Personality Drift Score · 人格偏移指数（越低越稳定）</p>

        <div class="identity-layers">
          <div class="identity-layer core">
            <h4>Layer 1 · Core Identity 核心人格层</h4>
            <p>${c.personality} · ${c.values} · ${c.language} · ${c.memories}</p>
          </div>
          <div class="identity-layer long">
            <h4>Layer 2 · Long-term Memory 长期记忆层</h4>
            <p>已固化 ${p.memoryLayers.longTerm} 条稳定记忆。包含重复出现、经多次确认的信息，如搬家、毕业、换工作等人生节点。</p>
          </div>
          <div class="identity-layer short">
            <h4>Layer 3 · Short-term Memory 短期记忆层</h4>
            <p>当前活跃 ${p.memoryLayers.shortTerm} 条短期记忆。具有时间衰减机制，超过一定时间后自动降低权重或归档。</p>
          </div>
          <div class="identity-layer context">
            <h4>Layer 4 · Conversation Context 会话层</h4>
            <p>当前对话的临时上下文，聊天结束后清空，不会写入人格数据库。</p>
          </div>
        </div>

        <div class="anti-tamper-alert">
          防污染机制运行中：检测到身份篡改、记忆注入、性格重置或价值观颠覆尝试时，系统将拒绝修改核心人格，并自动触发修正，恢复至原始身份状态。
        </div>

        <div class="actions" style="margin-top:24px;">
          <button class="primary" onclick="closeOverlay()">确认</button>
          <button onclick="resetDrift()">手动修复偏移</button>
        </div>
      `;
      overlay.classList.add('active');
    }

    window.resetDrift = function() {
      selectedPersona.driftScore = 0;
      updateIntegrityUI();
      closeOverlay();
      setTimeout(() => openCoreIdentityOverlay(), 400);
    };

    // Thought input (non-traditional chat)
    const thoughtText = document.getElementById('thought-text');
    const thoughtSend = document.getElementById('thought-send');

    function sendThought() {
      const text = thoughtText.value.trim();
      if (!text) return;
      thoughtText.value = '';

      const response = getCompanionResponse(text);
      const el = document.getElementById('companion-message');
      el.innerHTML = response.isGuard
        ? `<div style="color:#ffb4b4;margin-bottom:8px;font-size:11px;letter-spacing:0.1em;">${response.tamper.message} · 系统已拦截</div>${response.text}`
        : response.text;
      el.style.left = (gCanvas.width/2 + 120) + 'px';
      el.style.top = (gCanvas.height/2 - 80) + 'px';
      el.classList.add('active');
      setTimeout(() => el.classList.remove('active'), response.isGuard ? 8000 : 6000);
    }

    thoughtSend.addEventListener('click', sendThought);
    thoughtText.addEventListener('keypress', e => {
      if (e.key === 'Enter') sendThought();
    });

    // ==================== OVERLAYS ====================
    const overlay = document.getElementById('memory-overlay');
    const card = document.getElementById('memory-card');

    function openMemoryOverlay(memory, isMeteor = false) {
      const sourceBadge = memory.source ? `
        <span class="source-badge ${memory.source}">
          ${memory.source === 'verified' ? '✓ 已验证记忆' : memory.source === 'inferred' ? '◈ AI推测' : '◇ 虚构内容'}
        </span>
      ` : '';
      card.innerHTML = `
        <span class="tag">${memory.label}${isMeteor ? ' · 记忆流星' : ''}${sourceBadge}</span>
        <h2>${memory.title}</h2>
        <div class="date">${memory.date} · ${memory.persona || ''}</div>
        <div class="content">${memory.content}</div>
        <div class="actions">
          <button class="primary" onclick="closeOverlay()">收藏记忆</button>
          <button onclick="closeOverlay()">分享光点</button>
          <button onclick="closeOverlay()">关闭</button>
        </div>
      `;
      overlay.classList.add('active');
    }

    function openCapsuleOverlay(capsule) {
      card.innerHTML = `
        <span class="tag">时间胶囊 · ${capsule.type}</span>
        <h2>${capsule.title}</h2>
        <div class="date">开启时间：${capsule.openDate}</div>
        <div class="content">${capsule.content}</div>
        <div class="actions">
          <button class="primary" onclick="closeOverlay()">重新封存</button>
          <button onclick="closeOverlay()">关闭</button>
        </div>
      `;
      overlay.classList.add('active');
    }

    function openCapsuleLockedOverlay(capsule) {
      card.innerHTML = `
        <span class="tag">时间胶囊 · 锁定中</span>
        <h2>${capsule.title}</h2>
        <div class="date">预计开启：${capsule.openDate}</div>
        <div class="content">这封信尚未到开启时间。星图中的时间胶囊会在约定时刻自动点亮，像一颗迟到的星光抵达彼岸。</div>
        <div class="actions">
          <button onclick="closeOverlay()">关闭</button>
        </div>
      `;
      overlay.classList.add('active');
    }

    function openCommunityOverlay(user) {
      card.innerHTML = `
        <span class="tag">人生星系</span>
        <h2>${user.name} 的公开宇宙</h2>
        <div class="date">${user.memories} 段公开记忆 · 相似度 ${user.similarity}%</div>
        <div class="content">
          共同经历：${user.shared.join(' · ')}<br><br>
          点击进入即可浏览对方公开的星图记忆。相似的灵魂会在宇宙中以光桥相连。
        </div>
        <div class="actions">
          <button class="primary" onclick="closeOverlay()">进入星图</button>
          <button onclick="closeOverlay()">发送共鸣</button>
          <button onclick="closeOverlay()">关闭</button>
        </div>
      `;
      overlay.classList.add('active');
    }

    function openMailboxCreate() {
      card.innerHTML = `
        <span class="tag">新建时间胶囊</span>
        <h2>给未来的星光写信</h2>
        <div class="capsule-form">
          <input type="text" placeholder="胶囊标题" id="cap-title">
          <select id="cap-type">
            <option value="text">文字</option>
            <option value="photo">图片</option>
            <option value="video">视频</option>
            <option value="audio">音频</option>
          </select>
          <textarea rows="5" placeholder="写下你想对未来说的话..." id="cap-content"></textarea>
          <select id="cap-date">
            <option value="2027-06-15">1年后开启</option>
            <option value="2030-06-15">5年后开启</option>
            <option value="2035-06-15">10年后开启</option>
          </select>
          <button class="primary" onclick="createCapsule()">封存胶囊</button>
          <button onclick="closeOverlay()">取消</button>
        </div>
      `;
      overlay.classList.add('active');
    }

    window.createCapsule = function() {
      const title = document.getElementById('cap-title').value;
      const type = document.getElementById('cap-type').value;
      const content = document.getElementById('cap-content').value;
      const date = document.getElementById('cap-date').value;
      if (title && content) {
        capsules.push({ id: 'c' + Date.now(), title, type, openDate: date, status: 'locked', content });
        closeOverlay();
        if (currentView === 'mailbox') initMailbox();
      }
    };

    window.closeOverlay = function() {
      overlay.classList.remove('active');
    };

    document.getElementById('close-overlay').addEventListener('click', closeOverlay);
    overlay.addEventListener('click', e => {
      if (e.target === overlay) closeOverlay();
    });

    // ==================== TOOLTIP ====================
    const tooltip = document.getElementById('tooltip');
    function showTooltip(title, meta) {
      document.getElementById('tooltip-title').textContent = title;
      document.getElementById('tooltip-meta').innerHTML = meta;
      tooltip.classList.add('active');
    }
    function hideTooltip() {
      tooltip.classList.remove('active');
    }
    function updateTooltipPosition() {
      const x = mouse.x + 20;
      const y = mouse.y + 20;
      tooltip.style.left = Math.min(x, window.innerWidth - 220) + 'px';
      tooltip.style.top = Math.min(y, window.innerHeight - 100) + 'px';
    }

    // ==================== UTILS ====================
    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // Keyboard shortcut
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeOverlay();
    });

    // Initialize
    initUniverse();
  </script>
</body>
</html>
